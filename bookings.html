<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reserve your table at Céto. Book online for our Camps Bay, Constantia, or Franschhoek restaurants." />
  <title>Céto | Bookings</title>
  <link rel="icon" href="fish-outline.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="bookings.css" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<div id="top-anchor"></div>

<header></header>

<main class="booking-page">
  <h1 class="main-heading">Book a Table</h1>

  <form action="thank-you.html" method="GET" class="booking-form">
    <div class="field-group">
      <input type="text" name="name" placeholder="Your Name" required />
    </div>
    <div class="field-group">
      <input type="email" name="email" placeholder="Your Email" required />
    </div>
    <div class="field-group">
      <input type="tel" name="phone" placeholder="Phone Number" required />
    </div>
    <div class="field-group">
      <select name="branch" required>
        <option value="" disabled selected>Select a Branch</option>
        <option value="camps-bay">Camps Bay</option>
        <option value="constantia">Constantia</option>
        <option value="franschhoek">Franschhoek</option>
      </select>
    </div>
    <div class="field-group">
      <input type="date" name="date" required />
    </div>
    <div class="field-group">
      <input type="time" name="time" required />
    </div>
    <div class="field-group">
      <input type="number" name="guests" placeholder="Number of Guests" min="1" max="20" required />
    </div>
    <div class="field-group">
      <textarea name="requests" placeholder="Special Requests (optional)" rows="4"></textarea>
    </div>
    <button type="submit">Submit Booking</button>
  </form>
</main>

<footer></footer>

<script src="main.js"></script>
</body>
</html>
