<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with Céto. Find our Camps Bay, Constantia, and Franschhoek locations, or send us a general enquiry." />
  <title>Céto | Contact</title>
  <link rel="icon" href="fish-outline.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="contact.css" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<div id="top-anchor"></div>

<header></header>

<main class="contact-page">
  <h1 class="main-heading">Contact Us</h1>

  <div class="branches">
    <div class="branch reveal">
      <h2>Camps Bay</h2>
      <iframe src="https://maps.google.com/maps?q=Camps%20Bay%20South%20Africa&t=&z=13&ie=UTF8&iwloc=&output=embed" title="Camps Bay map"></iframe>
      <p>Phone: <a href="tel:+27210000001">+27 21 000 0001</a></p>
      <p>Email: <a href="mailto:campsbay@ceto.co.za">campsbay@ceto.co.za</a></p>
    </div>
    <div class="branch reveal" style="transition-delay: 0.15s">
      <h2>Constantia</h2>
      <iframe src="https://maps.google.com/maps?q=Constantia%20South%20Africa&t=&z=13&ie=UTF8&iwloc=&output=embed" title="Constantia map"></iframe>
      <p>Phone: <a href="tel:+27210000002">+27 21 000 0002</a></p>
      <p>Email: <a href="mailto:constantia@ceto.co.za">constantia@ceto.co.za</a></p>
    </div>
    <div class="branch reveal" style="transition-delay: 0.3s">
      <h2>Franschhoek</h2>
      <iframe src="https://maps.google.com/maps?q=Franschhoek%20South%20Africa&t=&z=13&ie=UTF8&iwloc=&output=embed" title="Franschhoek map"></iframe>
      <p>Phone: <a href="tel:+27210000003">+27 21 000 0003</a></p>
      <p>Email: <a href="mailto:franschhoek@ceto.co.za">franschhoek@ceto.co.za</a></p>
    </div>
  </div>

  <h2 class="enquiry-heading">General Enquiry</h2>
  <form class="contact-form">
    <input type="text" name="name" placeholder="Your Name" required />
    <input type="email" name="email" placeholder="Your Email" required />
    <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</main>

<footer></footer>

<script src="main.js"></script>
</body>
</html>
